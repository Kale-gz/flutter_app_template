name: flutter_app_template
description: Reusable Flutter starter with Firebase, Play updates and localization.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_analytics: ^13.0.1
  in_app_update: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.5.4

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: '#2457C5'
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png
  adaptive_icon_monochrome: assets/icons/app_icon_monochrome.png
  web:
    generate: true
    image_path: assets/icons/app_icon.png
    background_color: '#2457C5'
    theme_color: '#2457C5'
